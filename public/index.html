<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Дашборд эффективных часов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #11100e;
    --paper: #f7f4ee;
    --line: #cfc8bb;
    --line-soft: #e3ddd1;
    --muted: #8c8475;
    /* семантика статусов (требования) — приглушённые редакционные оттенки */
    --done-bg: #e7efe2;      /* светло-зелёный фон завершённой строки */
    --over: #9b2f2f;         /* потрачено больше плана — красный */
    --under: #2f5b33;        /* потрачено меньше плана — тёмно-зелёный */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    background:
      radial-gradient(60vw 60vw at 12% -8%, #efe6d8 0%, rgba(239,230,216,0) 60%),
      radial-gradient(55vw 55vw at 95% 8%, #e8e2ee 0%, rgba(232,226,238,0) 55%),
      radial-gradient(70vw 50vw at 80% 100%, #ece3d6 0%, rgba(236,227,214,0) 60%),
      var(--paper);
    background-attachment: fixed;
    font-family: "Jost", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300; font-size: 14px; letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 28px 80px; }

  /* ---- masthead ---- */
  .masthead { text-align: center; margin-bottom: 14px; }
  .masthead .eyebrow {
    font-size: 11px; letter-spacing: .42em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }
  .masthead h1 {
    font-family: "Bodoni Moda", "Didot", "Bodoni MT", Georgia, serif;
    font-weight: 900; font-size: clamp(48px, 9vw, 104px); line-height: .92;
    margin: 0; letter-spacing: .01em; text-transform: uppercase;
  }
  .masthead .sub {
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: clamp(15px, 2.4vw, 20px); color: #3b3833; margin-top: 10px;
  }
  .rule { border: 0; border-top: 1px solid var(--ink); margin: 22px 0 30px; }
  .rule.thin { border-top: 1px solid var(--line); margin: 0 0 26px; }

  /* ---- filters (frosted glass panel) ---- */
  .filters {
    background: rgba(255,255,255,0.42);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 12px 40px rgba(40,34,24,0.10);
    padding: 26px 28px; display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end;
    border-radius: 2px;
  }
  .field { display: flex; flex-direction: column; gap: 9px; }
  .field label {
    font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--muted); font-weight: 400;
  }
  .field input, .field select {
    height: 40px; border: 0; border-bottom: 1px solid var(--ink);
    background: transparent; padding: 0 2px; min-width: 160px;
    font-family: "Jost", sans-serif; font-size: 15px; color: var(--ink);
    border-radius: 0;
  }
  .field input:focus, .field select:focus { outline: none; border-bottom-color: #6a6253; }
  .field select { min-width: 260px; }
  .field input[type="number"] { min-width: 150px; }
  .dates { display: flex; gap: 22px; align-items: flex-end; }

  /* ---- glass apply button ---- */
  .apply-btn {
    position: relative; height: 52px; padding: 0 42px; cursor: pointer;
    background: rgba(255,255,255,0.20);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: 2px; color: var(--ink);
    font-family: "Bodoni Moda", Georgia, serif; font-weight: 500;
    font-size: 14px; letter-spacing: .34em; text-transform: uppercase;
    box-shadow: 0 8px 28px rgba(40,34,24,0.16), inset 0 1px 0 rgba(255,255,255,0.7);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .apply-btn::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .apply-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.32); box-shadow: 0 14px 36px rgba(40,34,24,0.22), inset 0 1px 0 rgba(255,255,255,0.8); }
  .apply-btn:active { transform: translateY(0); }
  .apply-btn:disabled { opacity: .55; cursor: default; transform: none; }

  .status-line {
    margin: 26px 2px 4px; color: var(--muted); min-height: 18px;
    font-size: 12px; letter-spacing: .08em; font-style: italic;
    font-family: "Bodoni Moda", Georgia, serif;
  }
  .status-line.error { color: var(--over); font-style: normal; }

  /* ---- table ---- */
  .table-card { margin-top: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 15px 16px; text-align: left; vertical-align: top; }
  thead th { border-bottom: 1.5px solid var(--ink); border-top: 1.5px solid var(--ink); }
  tbody td { border-bottom: 1px solid var(--line-soft); }
  th {
    font-family: "Jost", sans-serif; font-size: 10px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--ink); font-weight: 500; cursor: pointer;
    user-select: none; white-space: nowrap; background: transparent;
  }
  th:hover { color: #6a6253; }
  th .arrow { margin-left: 5px; font-size: 9px; vertical-align: middle; }
  th.num, td.num { text-align: right; white-space: nowrap; }
  td { font-size: 14.5px; }
  tr.completed td { background: var(--done-bg); }
  td a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color .15s; }
  td a:hover { border-bottom-color: var(--ink); }
  .num { font-variant-numeric: tabular-nums; }
  .spent-over { color: var(--over); font-weight: 400; }
  .spent-under { color: var(--under); font-weight: 400; }
  .badge {
    display: inline-block; padding: 4px 0; font-size: 10px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: #5a5346;
    border-bottom: 1px solid transparent;
  }
  .badge.done { color: var(--under); }
  .badge.progress { color: #2f4a6b; }
  .badge.wait { color: #8a6a1f; }
  .badge.deferred { color: #8c8475; }
  .empty {
    padding: 56px; text-align: center; color: var(--muted);
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 16px;
  }

  /* ---- result cards ---- */
  .cards { display: flex; gap: 26px; margin-top: 40px; flex-wrap: wrap; }
  .card {
    flex: 1 1 280px; padding: 30px 32px;
    background: rgba(255,255,255,0.34);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 10px 34px rgba(40,34,24,0.09);
    border-radius: 2px;
  }
  .card .card-title {
    font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted); font-weight: 400; margin-bottom: 16px;
  }
  .card .card-value {
    font-family: "Bodoni Moda", "Didot", Georgia, serif; font-weight: 500;
    font-size: 40px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .card.bonus .card-value { font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Bitrix24 · Аналитика труда</div>
    <h1>Effective<br>Hours</h1>
    <div class="sub">Эффективные часы и подтверждённая премия</div>
  </header>
  <hr class="rule" />

  <div class="filters">
    <div class="field dates">
      <div class="field">
        <label>Дата от</label>
        <input type="date" id="dateFrom" />
      </div>
      <div class="field">
        <label>Дата до</label>
        <input type="date" id="dateTo" />
      </div>
    </div>
    <div class="field">
      <label>Сотрудник</label>
      <select id="employee"><option value="">Загрузка…</option></select>
    </div>
    <div class="field">
      <label>Ставка часа (руб.)</label>
      <input type="number" id="rate" min="0" step="1" value="0" />
    </div>
    <button class="apply-btn" id="applyBtn">Применить</button>
  </div>

  <div class="status-line" id="status"></div>

  <div class="table-card" id="tableCard" style="display:none">
    <table>
      <thead>
        <tr id="headRow"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="cards" id="cards" style="display:none">
    <div class="card">
      <div class="card-title">Эффективные часы</div>
      <div class="card-value" id="effHours">—</div>
    </div>
    <div class="card bonus">
      <div class="card-title">Подтвержденная премия</div>
      <div class="card-value" id="confBonus">—</div>
    </div>
  </div>
</div>

<script>
const COLUMNS = [
  { key: 'projectName',    title: 'Проект',                  type: 'text' },
  { key: 'title',          title: 'Задача',                  type: 'text' },
  { key: 'status',         title: 'Статус задачи',           type: 'text' },
  { key: 'spentSeconds',   title: 'Потраченные часы',        type: 'num'  },
  { key: 'plannedSeconds', title: 'Плановые часы на задачу', type: 'num'  },
  { key: 'bonus',          title: 'Премия',                  type: 'num'  },
];

let rowsData = [];
let sortState = { key: null, dir: 1 };
const statusEl = document.getElementById('status');

function setStatus(msg, isError) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status-line' + (isError ? ' error' : '');
}

function fmtHM(seconds) {
  const s = Math.max(0, Math.round(Number(seconds) || 0));
  const h = Math.floor(s / 3600);
  const m = Math.round((s % 3600) / 60);
  return h + ' ч ' + m + ' мин';
}

function fmtMoney(v) {
  return (Number(v) || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
}

function badgeClass(code) {
  if (code === 5) return 'badge done';
  if (code === 3 || code === 4) return 'badge progress';
  if (code === 6 || code === 7) return 'badge deferred';
  return 'badge wait';
}

function renderHead() {
  const tr = document.getElementById('headRow');
  tr.innerHTML = '';
  for (const col of COLUMNS) {
    const th = document.createElement('th');
    if (col.type === 'num') th.className = 'num';
    let arrow = '';
    if (sortState.key === col.key) arrow = sortState.dir === 1 ? '▲' : '▼';
    th.innerHTML = col.title + (arrow ? ' <span class="arrow">' + arrow + '</span>' : '');
    th.onclick = () => {
      if (sortState.key === col.key) sortState.dir = -sortState.dir;
      else { sortState.key = col.key; sortState.dir = 1; }
      renderHead();
      renderBody();
    };
    tr.appendChild(th);
  }
}

function sortedRows() {
  const rows = rowsData.slice();
  if (!sortState.key) return rows;
  const col = COLUMNS.find((c) => c.key === sortState.key);
  rows.sort((a, b) => {
    let r;
    if (col.type === 'num') {
      r = (Number(a[col.key]) || 0) - (Number(b[col.key]) || 0);
    } else {
      r = String(a[col.key] || '').localeCompare(String(b[col.key] || ''), 'ru', { sensitivity: 'base' });
    }
    return r * sortState.dir;
  });
  return rows;
}

function renderBody() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const rows = sortedRows();
  if (rows.length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="empty" colspan="' + COLUMNS.length + '">Нет задач по выбранным фильтрам</td>';
    tbody.appendChild(tr);
    return;
  }
  for (const row of rows) {
    const tr = document.createElement('tr');
    if (row.isCompleted) tr.className = 'completed';

    // Проект
    const tdProj = document.createElement('td');
    if (row.projectUrl) {
      const a = document.createElement('a');
      a.href = row.projectUrl; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = row.projectName;
      tdProj.appendChild(a);
    } else tdProj.textContent = row.projectName;
    tr.appendChild(tdProj);

    // Задача
    const tdTask = document.createElement('td');
    if (row.taskUrl) {
      const a = document.createElement('a');
      a.href = row.taskUrl; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = row.title;
      tdTask.appendChild(a);
    } else tdTask.textContent = row.title;
    tr.appendChild(tdTask);

    // Статус
    const tdStatus = document.createElement('td');
    const span = document.createElement('span');
    span.className = badgeClass(row.statusCode);
    span.textContent = row.status;
    tdStatus.appendChild(span);
    tr.appendChild(tdStatus);

    // Потраченные
    const tdSpent = document.createElement('td');
    tdSpent.className = 'num';
    if (row.spentOver) tdSpent.classList.add('spent-over');
    else if (row.spentUnder) tdSpent.classList.add('spent-under');
    tdSpent.textContent = fmtHM(row.spentSeconds);
    tr.appendChild(tdSpent);

    // Плановые
    const tdPlan = document.createElement('td');
    tdPlan.className = 'num';
    tdPlan.textContent = fmtHM(row.plannedSeconds);
    tr.appendChild(tdPlan);

    // Премия
    const tdBonus = document.createElement('td');
    tdBonus.className = 'num';
    tdBonus.textContent = fmtMoney(row.bonus);
    tr.appendChild(tdBonus);

    tbody.appendChild(tr);
  }
}

function renderSummary(summary) {
  document.getElementById('effHours').textContent = fmtHM(summary.effectiveSeconds);
  document.getElementById('confBonus').textContent = fmtMoney(summary.confirmedBonus);
}

function redirectToAuth(url) {
  if (url) {
    setStatus('Требуется авторизация в Битрикс24…');
    (window.top || window).location.href = url;
  } else {
    setStatus('Нет доступа: не настроена авторизация приложения.', true);
  }
}

async function loadUsers() {
  const sel = document.getElementById('employee');
  const res = await fetch('/api/users');
  if (res.status === 401) {
    const j = await res.json().catch(() => ({}));
    redirectToAuth(j.authorizeUrl);
    return;
  }
  const j = await res.json();
  if (!j.users) { sel.innerHTML = '<option value="">— нет данных —</option>'; return; }
  sel.innerHTML = '<option value="">— выберите сотрудника —</option>';
  for (const u of j.users) {
    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = u.label + (u.position ? ' — ' + u.position : '');
    sel.appendChild(opt);
  }
}

async function apply() {
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const userId = document.getElementById('employee').value;
  const rate = document.getElementById('rate').value;

  if (!userId) { setStatus('Выберите сотрудника', true); return; }
  if (!dateFrom || !dateTo) { setStatus('Укажите период (от/до)', true); return; }
  if (dateFrom > dateTo) { setStatus('Дата «от» позже даты «до»', true); return; }

  const btn = document.getElementById('applyBtn');
  btn.disabled = true;
  setStatus('Загрузка данных…');
  try {
    const res = await fetch('/api/dashboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dateFrom, dateTo, userId, rate: Number(rate) || 0 }),
    });
    if (res.status === 401) {
      const j = await res.json().catch(() => ({}));
      redirectToAuth(j.authorizeUrl);
      return;
    }
    const j = await res.json();
    if (!res.ok) { setStatus(j.error || 'Ошибка загрузки', true); return; }

    rowsData = j.rows || [];
    renderHead();
    renderBody();
    renderSummary(j.summary || { effectiveSeconds: 0, confirmedBonus: 0 });
    document.getElementById('tableCard').style.display = '';
    document.getElementById('cards').style.display = 'flex';

    const note = j.meta && j.meta.periodIncludesToday
      ? 'Период включает сегодняшний день: показаны незавершённые задачи и завершённые в периоде.'
      : 'Период в прошлом: показаны только задачи, завершённые в выбранном периоде.';
    setStatus('Найдено задач: ' + rowsData.length + '. ' + note);
  } catch (e) {
    setStatus('Ошибка: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

function initDefaults() {
  // период по умолчанию — текущий месяц
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const iso = (d) => d.toISOString().slice(0, 10);
  document.getElementById('dateFrom').value = iso(first);
  document.getElementById('dateTo').value = iso(now);
}

document.getElementById('applyBtn').addEventListener('click', apply);

(async function init() {
  initDefaults();
  renderHead();
  try {
    const meRes = await fetch('/api/me');
    const me = await meRes.json();
    if (!me.authenticated) { redirectToAuth(me.authorizeUrl); return; }
    await loadUsers();
    setStatus('Выберите сотрудника и период, затем нажмите «Применить».');
  } catch (e) {
    setStatus('Ошибка инициализации: ' + e.message, true);
  }
})();
</script>
</body>
</html>
